version: '3.8'

services:
  # MySQL Database for testing
  mysql-test:
    image: mysql:8.0
    container_name: vta-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vta_test
      MYSQL_USER: giraf
      MYSQL_PASSWORD: Idedmf2002!
    ports:
      - "3307:3306"  # Different port to avoid conflicts with local MySQL
    volumes:
      - mysql_test_data:/var/lib/mysql
    networks:
      - vta-test-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "giraf", "-pIdedmf2002!"]
      timeout: 20s
      retries: 10

  # Backend API for testing
  backend-test:
    build:
      context: .
      dockerfile: Backend/VTA.API/Dockerfile
    container_name: vta-backend-test
    ports:
      - "5193:5192"  # Different port for test environment
    environment:
      - ConnectionStrings__DefaultConnection=server=mysql-test;port=3306;user=giraf;password=Idedmf2002!;database=vta_test
      - AUTO_CREATE_DATABASE=true
    depends_on:
      mysql-test:
        condition: service_healthy
    networks:
      - vta-test-network
    volumes:
      - ./Backend/VTA.API/Assets:/app/Assets  # Mount assets directory
    restart: unless-stopped

volumes:
  mysql_test_data:

networks:
  vta-test-network:
    driver: bridge
